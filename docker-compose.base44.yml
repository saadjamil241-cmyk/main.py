services:
  app:
    image: python:3.12-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        pip install --no-cache-dir -r requirements.txt
        exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    ports:
      - "3000:8000"
    volumes:
      - ./:/app
    environment:
      - OPENAI_MODEL=gpt-4o-mini
      - BASE44_PREVIEW_MODE
    env_file:
      # Platform-delivered secrets (e.g. OPENAI_API_KEY). Last entry always wins.
      - /run/base44/app.env
    restart: on-failure
    labels:
      base44.project: "Star.AI"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
